<div class="container bg-white p-4 rounded shadow">
    <h2 class="mb-3">Clean URL Slug Generator</h2>
    <p class="text-muted">for WhatsApp, Messenger, SMS, Telegram, and More</p>

    <label class="form-label fw-bold">INPUT STRING: <small class="text-muted">(Article title, tutorial title or any web page title)</small></label>
    <input type="text" id="inputText" class="form-control mb-3" placeholder="Enter your title here...">

    <div class="btn-group mb-3" role="group">
      <input type="radio" class="btn-check" name="separator" id="dash" value="-" checked>
      <label class="btn btn-outline-secondary" for="dash">Separate with dash (–)</label>

      <input type="radio" class="btn-check" name="separator" id="underscore" value="_">
      <label class="btn btn-outline-secondary" for="underscore">Separate with underscore (_)</label>
    </div>

    <div class="form-check form-check-inline ms-3">
      <input class="form-check-input" type="checkbox" id="removeStopWords" checked>
      <label class="form-check-label" for="removeStopWords">Remove stop words</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" id="removeNumbers" checked>
      <label class="form-check-label" for="removeNumbers">Remove numbers</label>
    </div>

    <div class="mt-3 mb-3">
      <button onclick="generateSlug()" class="btn btn-dark me-2">Generate</button>
      <button onclick="clearInput()" class="btn btn-outline-secondary me-2">Clear</button>
      <button onclick="resetAll()" class="btn btn-outline-danger">Reset</button>
    </div>

    <label class="form-label fw-bold">OUTPUT: <small class="text-muted">(Clean URL slug)</small></label>
    <input type="text" id="outputSlug" class="form-control mb-3" readonly>
    <button onclick="copySlug()" class="btn btn-outline-primary copy-btn">
      📋 <span>Copy</span>
    </button>
  </div>

  <script>
    const stopWords = ["a", "an", "the", "and", "or", "but", "on", "in", "with", "at", "to", "for", "of"];

    function generateSlug() {
      let input = document.getElementById('inputText').value.trim().toLowerCase();
      const separator = document.querySelector('input[name="separator"]:checked').value;
      const removeStop = document.getElementById('removeStopWords').checked;
      const removeNums = document.getElementById('removeNumbers').checked;

      if (removeStop) {
        const regex = new RegExp("\\b(" + stopWords.join("|") + ")\\b", "gi");
        input = input.replace(regex, '');
      }

      if (removeNums) {
        input = input.replace(/\d+/g, '');
      }

      let slug = input
        .replace(/[^a-z0-9\s]/g, '')
        .replace(/\s+/g, separator)
        .replace(new RegExp(`${separator}+`, 'g'), separator)
        .replace(new RegExp(`^${separator}|${separator}$`, 'g'), '');

      document.getElementById('outputSlug').value = slug;
    }

    function copySlug() {
      const output = document.getElementById("outputSlug");
      output.select();
      document.execCommand("copy");
    }

    function clearInput() {
      document.getElementById("inputText").value = "";
    }

    function resetAll() {
      document.getElementById("inputText").value = "";
      document.getElementById("outputSlug").value = "";
      document.getElementById("removeStopWords").checked = true;
      document.getElementById("removeNumbers").checked = true;
      document.getElementById("dash").checked = true;
    }
  </script>
