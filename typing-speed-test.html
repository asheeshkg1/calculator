<body class="p-4">

<div id="rt-top-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
        <a href="index.html" id="rt-back-link" style="color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
            <span>← Back to All Calculators</span>
        </a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <span style="color: #94a3b8; font-size: 13px;">RapidTools Online Suite</span>
    </div>
</div>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <span style="color: #94a3b8; font-size: 13px;">Looking for comprehensive conversion tables?</span>
        RapidTables.me
    </div>
</div>

<div id="rt-main-content-wrapper">
<div class="container">
    <h2 class="mb-3">Check your typing skills in a minute</h2>
    <div class="row mb-3">
      <div class="col-md-4">
        <label>Test Duration:</label>
        <select id="duration" class="form-select">
          <option value="60">1 minute</option>
          <option value="180">3 minutes</option>
          <option value="300">5 minutes</option>
        </select>
      </div>
      <div class="col-md-4">
        <label>Difficulty:</label>
        <select id="difficulty" class="form-select">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="col-md-4">
        <label>Mode:</label>
        <select id="mode" class="form-select">
          <option value="common">Common Words</option>
          <option value="random">Random Words</option>
        </select>
      </div>
    </div>

    <div class="d-flex align-items-center mb-3">
      <button id="startBtn" class="btn btn-success me-2">Start Test</button>
      <button id="restartBtn" class="btn btn-secondary">Restart</button>
      <h4 class="ms-auto">Time Left: <span id="timer">00:00</span></h4>
    </div>

    <div class="typing-box mb-3" id="textDisplay"></div>
    <textarea id="userInput" class="form-control" placeholder="Start typing here when the test begins..." disabled></textarea>

    <div class="row mt-4">
      <div class="col-md-4 stat-box bg-light p-3 rounded shadow">
        <strong>WPM</strong>
        <div id="wpm">0</div>
      </div>
      <div class="col-md-4 stat-box bg-light p-3 rounded shadow">
        <strong>Accuracy</strong>
        <div id="accuracy">0%</div>
      </div>
      <div class="col-md-4 stat-box bg-light p-3 rounded shadow">
        <strong>Errors</strong>
        <div id="errors">0</div>
      </div>
    </div>
  </div>

  <script>
    const words = "Artificial aviation appropriate awkward behavior acquire beginning balance atmosphere battery assumption appetite background assistance assessment approval articulate auction argument achievement attach awareness attitude ability algorithm administration".split(" ");
    
    const textDisplay = document.getElementById("textDisplay");
    const userInput = document.getElementById("userInput");
    const wpmDisplay = document.getElementById("wpm");
    const accuracyDisplay = document.getElementById("accuracy");
    const errorsDisplay = document.getElementById("errors");
    const timerDisplay = document.getElementById("timer");

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const durationSelect = document.getElementById("duration");

    let timer = null;
    let totalTime = 60;
    let timeLeft = 60;
    let intervalId;
    let originalText = "";
    let errors = 0;
    let correctChars = 0;

    function generateText() {
      const sentence = words.sort(() => 0.5 - Math.random()).slice(0, 80).join(" ");
      originalText = sentence;
      textDisplay.innerText = sentence;
    }

    function startTimer() {
      timeLeft = parseInt(durationSelect.value);
      totalTime = timeLeft;
      timerDisplay.innerText = formatTime(timeLeft);
      intervalId = setInterval(() => {
        timeLeft--;
        timerDisplay.innerText = formatTime(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(intervalId);
          userInput.disabled = true;
        }
      }, 1000);
    }

    function formatTime(seconds) {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function calculateStats() {
      const typedText = userInput.value;
      const wordsTyped = typedText.trim().split(/\s+/).length;
      const wpm = Math.round((wordsTyped / (totalTime - timeLeft)) * 60);
      const accuracy = Math.max(0, Math.round((correctChars / typedText.length) * 100));
      wpmDisplay.innerText = isNaN(wpm) ? 0 : wpm;
      accuracyDisplay.innerText = isNaN(accuracy) ? "0%" : `${accuracy}%`;
      errorsDisplay.innerText = errors;
    }

    userInput.addEventListener("input", () => {
      const typed = userInput.value;
      let correct = 0;
      errors = 0;

      for (let i = 0; i < typed.length; i++) {
        if (typed[i] === originalText[i]) {
          correct++;
        } else {
          errors++;
        }
      }
      correctChars = correct;
      calculateStats();
    });

    startBtn.addEventListener("click", () => {
      generateText();
      userInput.value = "";
      userInput.disabled = false;
      userInput.focus();
      errors = 0;
      correctChars = 0;
      clearInterval(intervalId);
      startTimer();
    });

    restartBtn.addEventListener("click", () => {
      clearInterval(intervalId);
      timerDisplay.innerText = "00:00";
      userInput.value = "";
      textDisplay.innerText = "";
      userInput.disabled = true;
      wpmDisplay.innerText = "0";
      accuracyDisplay.innerText = "0%";
      errorsDisplay.innerText = "0";
    });
  </script>
</div>
