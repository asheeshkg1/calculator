<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Case Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #eef1fb;
      padding: 30px;
    }
    textarea {
      resize: none;
      height: 200px;
    }
    .btn-custom {
      margin: 5px;
      min-width: 140px;
    }
    .copy-btn {
      position: relative;
      transition: all 0.3s ease;
    }
    .copy-btn.copied::after {
      content: "Copied!";
      position: absolute;
      top: -30px;
      right: 0;
      background: #198754;
      color: #fff;
      padding: 3px 10px;
      font-size: 12px;
      border-radius: 6px;
      opacity: 0;
      animation: fadeInOut 2s forwards;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(0); }
      20% { opacity: 1; transform: translateY(-5px); }
      80% { opacity: 1; transform: translateY(-5px); }
      100% { opacity: 0; transform: translateY(0); }
    }
  </style>

<body>

<div id="rt-top-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
        <a href="index.html" id="rt-back-link" style="color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
            <span>← All Calculators Suite</span>
        </a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <span style="color: #94a3b8; font-size: 13px;">Looking for comprehensive conversion tables?</span>
        <a href="https://www.rapidtables.me/" target="_blank" rel="noopener dofollow" style="color: #ffffff; background: linear-gradient(135deg, #10b981 0%, #059669 100%); text-decoration: none; font-weight: 700; padding: 5px 12px; border-radius: 6px; box-shadow: 0 2px 4px rgba(16,185,129,0.3); font-size: 13px;">
            Visit RapidTables.me ↗
        </a>
    </div>
</div>

<div id="rt-main-content-wrapper">
<div class="container">
    <textarea id="textInput" class="form-control mb-3" placeholder="Type or paste your content here"></textarea>

    <div class="d-flex flex-wrap">
      <button class="btn btn-secondary btn-custom" onclick="toSentenceCase()">Sentence case</button>
      <button class="btn btn-secondary btn-custom" onclick="toLowerCase()">lower case</button>
      <button class="btn btn-secondary btn-custom" onclick="toUpperCase()">UPPER CASE</button>
      <button class="btn btn-secondary btn-custom" onclick="toCapitalizedCase()">Capitalized Case</button>
      <button class="btn btn-secondary btn-custom" onclick="toAlternatingCase()">aLtErNaTiNg CaSe</button>
      <button class="btn btn-secondary btn-custom" onclick="toTitleCase()">Title Case</button>
      <button class="btn btn-secondary btn-custom" onclick="toInverseCase()">InVeRsE CaSe</button>
      <button class="btn btn-secondary btn-custom" onclick="downloadText()">Download Text</button>

      <!-- Modern Copy Button -->
      <button id="copyBtn" class="btn btn-success btn-custom copy-btn" onclick="copyToClipboard()">
        📋 Copy
      </button>

      <button class="btn btn-danger btn-custom" onclick="clearText()">Clear</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('textInput');
    const copyBtn = document.getElementById('copyBtn');

    function toSentenceCase() {
      input.value = input.value
        .toLowerCase()
        .replace(/(^\s*\w|[\.\!\?]\s*\w)/g, c => c.toUpperCase());
    }

    function toLowerCase() {
      input.value = input.value.toLowerCase();
    }

    function toUpperCase() {
      input.value = input.value.toUpperCase();
    }

    function toCapitalizedCase() {
      input.value = input.value
        .toLowerCase()
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function toTitleCase() {
      input.value = input.value
        .toLowerCase()
        .split(' ')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }

    function toAlternatingCase() {
      input.value = input.value
        .split('')
        .map((char, i) => i % 2 === 0 ? char.toLowerCase() : char.toUpperCase())
        .join('');
    }

    function toInverseCase() {
      input.value = input.value
        .split('')
        .map(char => char === char.toUpperCase() ? char.toLowerCase() : char.toUpperCase())
        .join('');
    }

    function copyToClipboard() {
      navigator.clipboard.writeText(input.value).then(() => {
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    }

    function clearText() {
      input.value = '';
    }

    function downloadText() {
      const blob = new Blob([input.value], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'converted-text.txt';
      link.click();
    }
  </script>
</div>

</footer>
