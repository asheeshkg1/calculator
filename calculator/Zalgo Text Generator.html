<div id="rt-main-content-wrapper">
<div class="container">
  <h2 class="mb-4 text-center">Zalgo Text Generator</h2>

  <div class="mb-3">
    <label for="inputText">Enter Text:</label>
    <textarea class="form-control" id="inputText" rows="4" placeholder="Type something spooky..." oninput="generateZalgo()"></textarea>
  </div>

  <div class="mb-3">
    <label>Zalgo Intensity:</label>
    <select class="form-select" id="zalgoLevel" onchange="generateZalgo()">
      <option value="mini">Mini</option>
      <option value="normal" selected>Normal</option>
      <option value="maxi">Maxi</option>
    </select>
  </div>

  <div class="mb-3">
    <label>Generated Zalgo Text:</label>
    <div class="zalgo-output" id="outputText"></div>
  </div>

  <button class="copy-btn" onclick="copyZalgo()">📋 Copy</button>
  <button class="clear-btn" onclick="clearZalgo()">Clear</button>
</div>

<script>
  const zalgo_up = [
    '\u030d','\u030e','\u0304','\u0305','\u033f','\u0311','\u0306','\u0310',
    '\u0352','\u0357','\u0351','\u0307','\u0308','\u030a','\u0342','\u0343',
    '\u0344','\u034a','\u034b','\u034c','\u0303','\u0302','\u030c','\u0350',
    '\u0300','\u0301','\u030b','\u030f','\u0312','\u0313','\u0314','\u033d',
    '\u0309','\u0363','\u0364','\u0365','\u0366','\u0367','\u0368','\u0369',
    '\u036a','\u036b','\u036c','\u036d','\u036e','\u036f','\u033e','\u035b',
    '\u0346','\u031a'
  ];

  const zalgo_down = [
    '\u0316','\u0317','\u0318','\u0319','\u031c','\u031d','\u031e','\u031f',
    '\u0320','\u0324','\u0325','\u0326','\u0329','\u032a','\u032b','\u032c',
    '\u032d','\u032e','\u032f','\u0330','\u0331','\u0332','\u0333','\u0339',
    '\u033a','\u033b','\u033c','\u0345','\u0347','\u0348','\u0349','\u034d',
    '\u034e','\u0353','\u0354','\u0355','\u0356','\u0359','\u035a','\u0323'
  ];

  const zalgo_mid = [
    '\u0315','\u031b','\u0340','\u0341','\u0358','\u0321','\u0322','\u0327',
    '\u0328','\u0334','\u0335','\u0336','\u034f','\u035c','\u035d','\u035e',
    '\u035f','\u0360','\u0362','\u0338','\u0337','\u0361','\u0489'
  ];

  function randomZalgo(chars, count) {
    let result = '';
    for (let i = 0; i < count; i++) {
      result += chars[Math.floor(Math.random() * chars.length)];
    }
    return result;
  }

  function zalgoize(text, level) {
    let count = { mini: 1, normal: 3, maxi: 8 }[level];
    return text.split('').map(char => {
      if (char === ' ') return char;
      return char + randomZalgo(zalgo_up, count) +
                    randomZalgo(zalgo_mid, count) +
                    randomZalgo(zalgo_down, count);
    }).join('');
  }

  function generateZalgo() {
    const text = document.getElementById("inputText").value;
    const level = document.getElementById("zalgoLevel").value;
    document.getElementById("outputText").textContent = zalgoize(text, level);
  }

  function copyZalgo() {
    const output = document.getElementById("outputText").textContent;
    navigator.clipboard.writeText(output);
    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.innerHTML = "✅ Copied!";
    setTimeout(() => { btn.innerHTML = originalText; }, 1500);
  }

  function clearZalgo() {
    document.getElementById("inputText").value = "";
    document.getElementById("outputText").textContent = "";
  }
</script>
