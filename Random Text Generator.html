    <h1 class="mb-4">📝 Random Text Generator</h1>

    <div class="row mb-4">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Text format:</label>
        <div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="format" value="plain" checked>
            <label class="form-check-label">Plain Text</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="format" value="paragraph">
            <label class="form-check-label">Paragraphs &lt;p&gt;</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="format" value="heading">
            <label class="form-check-label">Headings &lt;h1&gt;-&lt;h6&gt;</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="format" value="list">
            <label class="form-check-label">List (UL/OL)</label>
          </div>
        </div>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Number of items:</label>
        <input type="number" id="count" class="form-control" value="10" min="1" max="100">
        <button class="btn btn-primary mt-3 w-100" onclick="generateText()">Generate Text</button>
      </div>
    </div>

    <textarea id="output" class="form-control mb-3" rows="8" readonly placeholder="Generated text will appear here..."></textarea>

    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-success copy-btn" onclick="copyText(this)">📋 Copy</button>
      <button class="btn btn-danger" onclick="clearText()">🗑 Clear</button>
      <button class="btn btn-secondary" onclick="downloadText()">⬇ Download as TXT</button>
    </div>
  </div>

  <script>
    const words = [
      "Implement caching mechanism", "Prepare for production release", "Set up monitoring system",
      "Write documentation", "Fix reported bugs", "Schedule team meeting",
      "Test application performance", "Optimize loading speed", "Enable dark mode",
      "Launch marketing campaign", "Setup user authentication"
    ];

    function generateText() {
      const count = parseInt(document.getElementById('count').value);
      const format = document.querySelector('input[name="format"]:checked').value;
      let output = '';

      for (let i = 0; i < count; i++) {
        const text = words[Math.floor(Math.random() * words.length)];
        if (format === 'plain') output += text + '\n';
        else if (format === 'paragraph') output += `<p>${text}</p>\n`;
        else if (format === 'heading') output += `<h${(i % 6) + 1}>${text}</h${(i % 6) + 1}>\n`;
        else if (format === 'list') output += `• ${text}\n`;
      }

      document.getElementById('output').value = output.trim();
    }

    function copyText(button) {
      const output = document.getElementById('output');
      output.select();
      document.execCommand('copy');
      button.classList.add("copied");
      setTimeout(() => button.classList.remove("copied"), 2000);
    }

    function clearText() {
      document.getElementById('output').value = '';
    }

    function downloadText() {
      const blob = new Blob([document.getElementById('output').value], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'random-text.txt';
      link.click();
    }
  </script>
