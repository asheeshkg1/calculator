        RapidTables.me

<div id="rt-main-content-wrapper">
<div class="container">
    <h2 class="mb-4">Text Compare Tool</h2>
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="text1">Text 1</label>
        <textarea class="form-control" id="text1"></textarea>
      </div>
      <div class="col-md-6">
        <label for="text2">Text 2</label>
        <textarea class="form-control" id="text2"></textarea>
      </div>
    </div>
    <div class="mb-3">
      <button class="btn btn-primary" onclick="compareTexts()">Compare</button>
      <button class="btn btn-secondary" onclick="swapTexts()">Swap</button>
      <button class="btn btn-danger" onclick="clearTexts()">Clear</button>
      <label class="ms-3">
        <input type="checkbox" id="ignoreCase"> Ignore Case
      </label>
      <label class="ms-2">
        <input type="checkbox" id="ignoreWhitespace"> Ignore Whitespace
      </label>
    </div>
    <div id="result" class="row"></div>
  </div>

  <script>
    function getLines(text, ignoreCase, ignoreWhitespace) {
      let lines = text.split('\n');
      if (ignoreWhitespace) lines = lines.map(line => line.trim());
      if (ignoreCase) lines = lines.map(line => line.toLowerCase());
      return lines;
    }

    function compareTexts() {
      const text1 = document.getElementById('text1').value;
      const text2 = document.getElementById('text2').value;
      const ignoreCase = document.getElementById('ignoreCase').checked;
      const ignoreWhitespace = document.getElementById('ignoreWhitespace').checked;

      const lines1 = getLines(text1, ignoreCase, ignoreWhitespace);
      const lines2 = getLines(text2, ignoreCase, ignoreWhitespace);

      let result1 = '', result2 = '';
      const maxLen = Math.max(lines1.length, lines2.length);

      for (let i = 0; i < maxLen; i++) {
        const l1 = lines1[i] || "[Empty]";
        const l2 = lines2[i] || "[Empty]";

        let cls = '';
        if (l1 === l2) cls = 'diff-same';
        else cls = 'diff-removed';

        result1 += `<div class="p-2 ${cls}">${l1}</div>`;
        result2 += `<div class="p-2 ${cls}">${l2}</div>`;
      }

      document.getElementById('result').innerHTML = `
        <div class="col-md-6">
          <h5>Text 1 <button class="copy-btn float-end" onclick="copyToClipboard('text1')">Copy</button></h5>
          <div class="border">${result1}</div>
        </div>
        <div class="col-md-6">
          <h5>Text 2 <button class="copy-btn float-end" onclick="copyToClipboard('text2')">Copy</button></h5>
          <div class="border">${result2}</div>
        </div>
      `;
    }

    function copyToClipboard(id) {
      const textarea = document.getElementById(id);
      textarea.select();
      document.execCommand('copy');
    }

    function swapTexts() {
      const t1 = document.getElementById('text1');
      const t2 = document.getElementById('text2');
      [t1.value, t2.value] = [t2.value, t1.value];
    }

    function clearTexts() {
      document.getElementById('text1').value = '';
      document.getElementById('text2').value = '';
      document.getElementById('result').innerHTML = '';
    }
  </script>
</div>
