<div class="container">
  <h2 class="mb-4 text-center">Upside Down Text Generator</h2>

  <div class="mb-3">
    <label for="inputText" class="form-label fw-bold">Enter Text:</label>
    <textarea class="form-control" id="inputText" rows="4" placeholder="Type or paste your text here..." oninput="generateText()"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label fw-bold">Text Effects:</label><br>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" id="backwards" checked onchange="generateText()">
      <label class="form-check-label" for="backwards">Backwards Effect</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" id="upsidedown" checked onchange="generateText()">
      <label class="form-check-label" for="upsidedown">Upside Down Effect</label>
    </div>
  </div>

  <div class="mb-3">
    <label for="outputText" class="form-label fw-bold">Generated Text:</label>
    <textarea class="form-control" id="outputText" rows="4" readonly></textarea>
  </div>

  <button class="copy-btn" onclick="copyText()">📋 Copy</button>
  <button class="clear-btn" onclick="clearText()">Clear</button>
</div>

<script>
  const upsideDownMap = {
    a: "ɐ", b: "q", c: "ɔ", d: "p", e: "ǝ", f: "ɟ", g: "ƃ",
    h: "ɥ", i: "ᴉ", j: "ɾ", k: "ʞ", l: "ʃ", m: "ɯ", n: "u",
    o: "o", p: "d", q: "b", r: "ɹ", s: "s", t: "ʇ", u: "n",
    v: "ʌ", w: "ʍ", x: "x", y: "ʎ", z: "z",
    A: "∀", B: "𐐒", C: "Ɔ", D: "◖", E: "Ǝ", F: "Ⅎ", G: "פ",
    H: "H", I: "I", J: "ſ", K: "⋊", L: "˥", M: "W", N: "N",
    O: "O", P: "Ԁ", Q: "Ό", R: "ᴚ", S: "S", T: "┴", U: "∩",
    V: "Λ", W: "M", X: "X", Y: "⅄", Z: "Z",
    "1": "Ɩ", "2": "ᄅ", "3": "Ɛ", "4": "ㄣ", "5": "ϛ", "6": "9",
    "7": "ㄥ", "8": "8", "9": "6", "0": "0",
    ".": "˙", ",": "'", "'": ",", '"': ",,", "!": "¡", "?": "¿",
    "(": ")", ")": "(", "[": "]", "]": "[", "{": "}", "}": "{",
    "<": ">", ">": "<", "&": "⅋", "_": "‾", "\n": "\n", " ": " "
  };

  function generateText() {
    const input = document.getElementById("inputText").value;
    let result = input;

    if (document.getElementById("upsidedown").checked) {
      let flipped = '';
      for (let i = 0; i < result.length; i++) {
        const char = result[i];
        flipped += upsideDownMap[char] || upsideDownMap[char.toLowerCase()] || char;
      }
      result = flipped;
    }

    if (document.getElementById("backwards").checked) {
      result = result.split('').reverse().join('');
    }

    document.getElementById("outputText").value = result;
  }

  function copyText() {
    const output = document.getElementById("outputText");
    output.select();
    output.setSelectionRange(0, 99999);
    document.execCommand("copy");

    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.innerHTML = "✅ Copied!";
    setTimeout(() => { btn.innerHTML = originalText; }, 1500);
  }

  function clearText() {
    document.getElementById("inputText").value = "";
    document.getElementById("outputText").value = "";
    generateText();
  }
</script>
